<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lord Walker — Launch</title>

<style>
  :root{
    --bg:#07070b;
    --fg:#ffffff;
    --muted:#d0d0da;
    --line:rgba(255,255,255,.14);
    --gold1:#c9a227;
    --gold2:#f5de87;
  }

  body{
    margin:0;
    height:100vh;
    display:grid;
    place-items:center;
    background:radial-gradient(1200px 600px at 50% 30%, rgba(255,255,255,.06), transparent 60%), var(--bg);
    color:var(--fg);
    font-family:system-ui;
    overflow:hidden;
  }

  /* ====== CONTENT LAYER ====== */
  .box{
    width:min(920px, 92vw);
    text-align:center;
    padding:46px 18px;
    position:relative;
    z-index:2; /* always above background */
  }

  /* readable premium panel */
  .panel{
    margin:0 auto;
    width:min(760px, 92vw);
    padding:28px 22px 24px;
    border:1px solid rgba(255,255,255,.10);
    border-radius:22px;
    background:rgba(10,10,16,.62);
    backdrop-filter: blur(10px);
    box-shadow: 0 18px 60px rgba(0,0,0,.45);
  }

  .badge{
    display:inline-block;
    padding:8px 14px;
    border:1px solid var(--line);
    border-radius:999px;
    color:#f0f0f6;
    letter-spacing:.8px;
    font-size:13px;
    background:rgba(255,255,255,.04);
  }

  h1{
    margin:18px 0 8px;
    font-size:46px;
    font-weight:900;
    letter-spacing:.2px;
    text-shadow:0 0 22px rgba(255,255,255,.10);
  }

  .sub{
    margin:0;
    color:var(--muted);
    font-size:18px;
    line-height:1.45;
  }

  .timer{
    margin:18px 0 6px;
    font-size:118px;
    font-weight:950;
    letter-spacing:2px;
    text-shadow:0 0 26px rgba(255,255,255,.12);
  }

  .barWrap{
    margin:16px auto 0;
    width:min(520px, 84vw);
    height:7px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    overflow:hidden;
    background:rgba(255,255,255,.05);
  }
  .bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, rgba(255,255,255,.55), rgba(255,255,255,.95));
    transition:width .9s ease;
  }

  .fade-out{
    animation: fadeOut 0.9s ease forwards;
  }
  @keyframes fadeOut{
    to{ opacity:0; transform:scale(.985); }
  }

  /* ====== READY SCREEN ====== */
  .ready{
    position:fixed;
    inset:0;
    display:grid;
    place-items:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .5s ease;
    z-index:3;
  }
  .ready.show{
    opacity:1;
    pointer-events:auto;
  }
  .readyTitle{
    font-size:64px;
    font-weight:950;
    letter-spacing:1px;
    text-transform:uppercase;
    margin:0 0 14px;
    text-shadow:0 0 28px rgba(255,255,255,.10);
  }
  .readyHint{
    font-size:20px;
    color:#f0f0f6;
    margin:0;
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
  }
  .key{
    border:1px solid rgba(255,255,255,.22);
    border-radius:12px;
    padding:6px 12px;
    font-weight:900;
    background:rgba(255,255,255,.06);
  }
  .btn{
    display:none;
    padding:14px 24px;
    font-size:18px;
    font-weight:900;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.22);
    background:#fff;
    color:#000;
    margin-top:16px;
  }
  .pulse{ animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.78} }

  /* ====== CURTAIN (HIDDEN UNTIL LAUNCH) ====== */
  .curtain{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
    opacity:0;               /* hidden initially */
    transition:opacity .25s ease;
  }
  .curtain.show{ opacity:1; }

  .curtain:before, .curtain:after{
    content:"";
    position:absolute;
    top:0; bottom:0;
    width:50%;
    /* Velvet-ish: deep maroon with subtle folds */
    background:
      linear-gradient(90deg, rgba(0,0,0,.25), rgba(0,0,0,0)),
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.04) 0px,
        rgba(255,255,255,.01) 18px,
        rgba(255,255,255,.00) 34px
      ),
      radial-gradient(900px 900px at 30% 40%, rgba(160,0,40,.55), rgba(40,0,20,.95) 60%, rgba(8,0,8,.98)),
      linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.22));
  }
  .curtain:before{
    left:0;
    box-shadow: 18px 0 60px rgba(0,0,0,.65);
    border-right: 2px solid rgba(255,255,255,.05);
  }
  .curtain:after{
    right:0;
    transform:scaleX(-1);
    box-shadow: -18px 0 60px rgba(0,0,0,.65);
    border-left: 2px solid rgba(255,255,255,.05);
  }

  /* Gold edge trimming */
  .curtain .gold{
    position:absolute;
    top:0; bottom:0;
    width:14px;
    background:linear-gradient(180deg, var(--gold2), var(--gold1), var(--gold2));
    filter: drop-shadow(0 0 10px rgba(245,222,135,.25));
    opacity:.95;
  }
  .curtain .gold.left{ left:calc(50% - 7px); }
  .curtain .gold.right{ left:calc(50% - 7px); } /* sits at center seam too */

  /* Opening animation (slow) */
  .curtain.open:before{ animation: openLeft 2.2s cubic-bezier(.2,.9,.2,1) forwards; }
  .curtain.open:after { animation: openRight 2.2s cubic-bezier(.2,.9,.2,1) forwards; }

  @keyframes openLeft { to{ transform:translateX(-104%); } }
  @keyframes openRight{ to{ transform:translateX(104%); } }

  /* Mobile adjustments */
  @media (max-width:520px){
    h1{ font-size:34px; }
    .timer{ font-size:88px; }
    .readyTitle{ font-size:44px; }
  }
</style>
</head>

<body>

<!-- Curtain exists but is hidden until launch -->
<div class="curtain" id="curtain" aria-hidden="true">
  <!-- Gold seam accent (looks like center trim) -->
  <div class="gold left"></div>
</div>

<!-- Screen 1 -->
<div class="box" id="screen1">
  <div class="panel">
    <div class="badge">LORD WALKER • LAUNCH SEQUENCE</div>
    <h1>Awaiting authorization</h1>
    <p class="sub">Preparing storefront…</p>

    <div class="timer" id="t">10</div>
    <div class="barWrap"><div class="bar" id="bar"></div></div>
  </div>
</div>

<!-- Screen 2 -->
<div class="ready" id="ready">
  <div class="panel" style="text-align:center;">
    <div class="readyTitle">Storefront Prepared</div>

    <p class="readyHint pulse" id="desktopHint">
      Press <span class="key">ENTER</span> to Launch
    </p>

    <button class="btn" id="mobileBtn">Tap to Launch</button>
  </div>
</div>

<script>
  const DEST = "https://www.lordwalker.in";

  // knobs
  const START_SECONDS = 12;  // try 12/15 if you want
  const TICK_MS = 1200;      // slower feel
  const CURTAIN_MS = 2800;   // must match CSS 2.2s

  let seconds = START_SECONDS;
  let isReady = false;
  let isLaunching = false;

  const t = document.getElementById("t");
  const bar = document.getElementById("bar");
  const screen1 = document.getElementById("screen1");
  const ready = document.getElementById("ready");
  const desktopHint = document.getElementById("desktopHint");
  const mobileBtn = document.getElementById("mobileBtn");
  const curtain = document.getElementById("curtain");

  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

  if(isMobile){
    desktopHint.style.display = "none";
    mobileBtn.style.display = "inline-block";
  }

  function setProgress(){
    const done = (START_SECONDS - seconds) / START_SECONDS;
    bar.style.width = Math.min(100, Math.max(0, done * 100)) + "%";
  }

  function countdown(){
    t.textContent = seconds;
    setProgress();

    if(seconds === 0){
      screen1.classList.add("fade-out");
      setTimeout(() => {
        isReady = true;
        ready.classList.add("show");
      }, 900);
      return;
    }

    seconds--;
    setTimeout(countdown, TICK_MS);
  }

  function launch(){
    if(!isReady || isLaunching) return;
    isLaunching = true;

    // Hide ready panel (clean moment)
    ready.classList.remove("show");

    // Now show curtain (it was hidden), then open it slowly
    curtain.classList.add("show");
    // tiny delay makes the "appear then open" smooth
    setTimeout(() => curtain.classList.add("open"), 60);

    // Redirect after curtain opens
    setTimeout(() => {
      window.location.href = DEST;
    }, CURTAIN_MS + 180);
  }

  countdown();

  // Desktop Enter
  document.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && !isMobile) launch();
  });

  // Mobile tap
  mobileBtn.addEventListener("click", launch);

  // Meet focus helper: click once on page so key events fire reliably
  document.addEventListener("click", () => {});
</script>

</body>
</html>
