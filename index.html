<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lord Walker — Launch</title>

<style>
body{
  margin:0;
  display:grid;
  place-items:center;
  height:100vh;
  font-family:system-ui;
  background:#0b0b0f;
  color:#fff;
  overflow:hidden;
}

.box{max-width:880px;padding:40px;text-align:center}

.badge{
  display:inline-block;
  border:1px solid #333;
  padding:8px 12px;
  border-radius:999px;
  color:#bbb
}

h1{font-size:42px;margin:16px 0 10px}

.timer{
  font-size:110px;
  margin:18px 0 10px;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 0 28px rgba(255,255,255,.12);
}

.sub{
  color:#9a9aa3;
  font-size:16px;
  margin-top:14px;
}

.fade-out{
  animation:fadeOut 1.1s ease forwards;
}
@keyframes fadeOut{
  to{opacity:0;transform:scale(.985)}
}

.ready-screen{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .9s ease;
}
.ready-screen.show{
  opacity:1;
  pointer-events:auto;
}

.ready-title{
  font-size:60px;
  font-weight:900;
  text-transform:uppercase;
  text-shadow:0 0 34px rgba(255,255,255,.12);
  margin-bottom:16px;
}

.launch-btn{
  display:none;
  margin-top:18px;
  padding:14px 26px;
  font-size:20px;
  border-radius:14px;
  border:1px solid #444;
  background:#fff;
  color:#000;
  font-weight:800;
}

.keyhint{
  margin-top:12px;
  font-size:18px;
  color:#ddd;
}
</style>
</head>

<body>

<div class="box" id="wrap">
  <div class="badge">Lord Walker</div>
  <h1>Launch Sequence Armed</h1>
<h3>Launching in....</h3>
  <div class="timer" id="t">10</div>
  <div class="sub">Preparing storefront…</div>
</div>

<div class="ready-screen" id="readyScreen">
  <div>
    <div class="ready-title">Storefront Prepared</div>
    <div class="keyhint" id="keyHint">Press ENTER to Launch</div>
    <button class="launch-btn" id="launchBtn">Tap to Launch</button>
  </div>
</div>

<script>
const DEST = "https://www.lordwalker.in";

let seconds = 10;
const t = document.getElementById("t");
const wrap = document.getElementById("wrap");
const readyScreen = document.getElementById("readyScreen");
const launchBtn = document.getElementById("launchBtn");
const keyHint = document.getElementById("keyHint");

let isReady = false;

/* Detect mobile */
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

if(isMobile){
  keyHint.style.display="none";
  launchBtn.style.display="inline-block";
}

function countdown(){
  t.textContent = seconds;

  if(seconds===0){
    wrap.classList.add("fade-out");
    setTimeout(()=>{
      isReady=true;
      readyScreen.classList.add("show");
    },1000);
    return;
  }

  seconds--;
  setTimeout(countdown,1200);
}
countdown();

/* Desktop Enter */
document.addEventListener("keydown", function(e){
  if(e.key==="Enter" && isReady){
    window.location.href=DEST;
  }
});

/* Mobile tap */
launchBtn.addEventListener("click", ()=>{
  window.location.href=DEST;
});
</script>

</body>
</html>
