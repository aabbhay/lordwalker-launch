<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lord Walker — Launch</title>

<style>
body{
  margin:0;
  display:grid;
  place-items:center;
  height:100vh;
  font-family:system-ui;
  background:#0b0b0f;
  color:#fff;
  overflow:hidden;
}

.box{max-width:820px;padding:38px;text-align:center}

.badge{
  display:inline-block;
  border:1px solid #333;
  padding:8px 12px;
  border-radius:999px;
  color:#bbb
}

h1{font-size:46px;margin:16px 0 10px}

.timer{
  font-size:110px;
  margin:18px 0 10px;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 0 25px rgba(255,255,255,.12);
}

.sub{
  color:#9a9aa3;
  font-size:16px;
  margin-top:14px;
}

.ready{
  color:#ffffff;
  font-size:22px;
  margin-top:16px;
  opacity:0;
  transition:opacity .8s ease;
}

.show{opacity:1}

.fade-out{
  animation:fadeOut 1.1s ease forwards;
}

@keyframes fadeOut{
  to{opacity:0;transform:scale(.985)}
}
</style>
</head>

<body>

<div class="box" id="wrap">
  <div class="badge">Lord Walker</div>
  <h1>The brand is ready</h1>

  <div class="timer" id="t">10</div>

  <div class="sub">Preparing storefront…</div>

  <div class="ready" id="readyMsg">
    Press <b>ENTER</b> to open
  </div>
</div>

<script>
const DEST = "https://www.lordwalker.in";

let seconds = 10;
const t = document.getElementById("t");
const ready = document.getElementById("readyMsg");
const wrap = document.getElementById("wrap");

function countdown(){
  t.textContent = seconds;

  if(seconds === 0){
    ready.classList.add("show");
    return;
  }

  seconds--;
  setTimeout(countdown, 1200);
}

countdown();

/* Wait for Enter key */
document.addEventListener("keydown", function(e){
  if(e.key === "Enter" && seconds === 0){
    wrap.classList.add("fade-out");
    setTimeout(() => {
      window.location.href = DEST;
    }, 900);
  }
});
</script>

</body>
</html>
