<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lord Walker — Launch</title>

<style>
  body{
    margin:0;
    display:grid;
    place-items:center;
    height:100vh;
    font-family:system-ui;
    background:#0b0b0f;
    color:#fff;
    overflow:hidden;
  }

  .box{max-width:880px;padding:40px;text-align:center}

  .badge{
    display:inline-block;
    border:1px solid #333;
    padding:8px 12px;
    border-radius:999px;
    color:#bbb
  }

  h1{font-size:46px;margin:16px 0 10px}

  .timer{
    font-size:110px;
    margin:18px 0 10px;
    font-weight:900;
    letter-spacing:2px;
    text-shadow:0 0 28px rgba(255,255,255,.12);
  }

  .sub{
    color:#9a9aa3;
    font-size:16px;
    margin-top:14px;
  }

  /* Fade out the first screen */
  .fade-out{
    animation:fadeOut 1.1s ease forwards;
  }
  @keyframes fadeOut{
    to{opacity:0;transform:scale(.985)}
  }

  /* Second screen (ready state) */
  .ready-screen{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .9s ease;
  }
  .ready-screen.show{
    opacity:1;
    pointer-events:auto;
  }

  .ready-box{
    text-align:center;
    padding:40px;
    max-width:920px;
  }

  .ready-title{
    font-size:64px;
    font-weight:950;
    letter-spacing:1px;
    text-transform:uppercase;
    text-shadow:0 0 34px rgba(255,255,255,.12);
    margin:0 0 14px;
  }

  .ready-sub{
    font-size:22px;
    color:#d8d8de;
    margin:0;
  }

  .key{
    display:inline-block;
    border:1px solid #3b3b46;
    padding:6px 12px;
    border-radius:10px;
    margin-left:8px;
    font-weight:800;
    color:#fff;
    background:rgba(255,255,255,.04);
  }

  /* Tiny pulse to draw attention */
  .pulse{
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:translateY(0); opacity:1}
    50%{transform:translateY(-2px); opacity:.85}
  }
</style>
</head>

<body>

<!-- Screen 1 -->
<div class="box" id="wrap">
  <div class="badge">Lord Walker</div>
  <h1>Launch Sequence Armed..</h1>
<h1>Preparing In..</h1>


  <div class="timer" id="t">10</div>

  <div class="sub" id="subtext">Preparing storefront…</div>
</div>

<!-- Screen 2 -->
<div class="ready-screen" id="readyScreen">
  <div class="ready-box">
    <div class="ready-title">Storefront Prepared</div>
    <p class="ready-sub pulse">Press <span class="key">ENTER</span> to Launch</p>
  </div>
</div>

<script>
  const DEST = "https://www.lordwalker.in";

  let seconds = 10;               // change to 12/15 if you want
  const TICK_MS = 1200;           // slower tick

  const t = document.getElementById("t");
  const wrap = document.getElementById("wrap");
  const subtext = document.getElementById("subtext");
  const readyScreen = document.getElementById("readyScreen");

  let isReady = false;

  function countdown(){
    t.textContent = seconds;

    if(seconds === 0){
      // Step 1: fade out screen 1
      wrap.classList.add("fade-out");

      // Step 2: after fade, show ready screen
      setTimeout(() => {
        isReady = true;
        readyScreen.classList.add("show");
      }, 1050);

      return;
    }

    seconds--;
    setTimeout(countdown, TICK_MS);
  }

  countdown();

  // Launch only on Enter after ready
  document.addEventListener("keydown", function(e){
    if(e.key === "Enter" && isReady){
      readyScreen.classList.remove("show"); // quick hide
      window.location.href = DEST;
    }
  });

  // Optional: also allow click anywhere to focus (helps in Meet)
  document.addEventListener("click", () => {
    // no-op, but ensures user interacts with page so key events fire reliably
  });
</script>

</body>
</html>
